<script>
  /* 08/09/2026 — INVERSÃO DO REDIRECIONAMENTO.
     Até hoje a RAIZ era um arquivo de 1,2 KB que mandava para cá, e o Google era
     convidado a indexar uma casca vazia. Agora a raiz serve a home inteira e é este
     arquivo que encaminha, para não quebrar link antigo, favorito, anúncio ou e-mail
     do Supabase que ainda aponte para /public/index.html.

     ?query e #fragmento são copiados na íntegra: o e-mail de definir senha chega com o
     token no fragmento, e quem o lê é o bloco inline do <head> da raiz. Sem esta cópia,
     o token morre no salto (foi o motivo de o script existir na raiz antes da inversão).

     A TRAVA DE LAÇO existe porque, na janela de cache do GitHub Pages, um navegador pode
     ainda ter a RAIZ ANTIGA guardada — a que mandava para cá. Sem trava, os dois arquivos
     ficariam se empurrando. Duas defesas, e nenhuma delas atrapalha quem só clicou em
     "Início" vindo de outra página:
       1. se o visitante VEIO da raiz, não devolvemos ele para lá;
       2. se este arquivo saltou 3 vezes em menos de 8 segundos, é laço: para e mostra o link.
     Contador, e não "saltou uma vez", de propósito: bloquear no primeiro salto quebraria
     quem navega de /public/termos.html para a home duas vezes seguidas. */
  (function () {
    try {
      var raiz = location.origin + "/";
      var ref = document.referrer || "";
      if (ref === raiz || ref.indexOf(raiz + "?") === 0 || ref.indexOf(raiz + "#") === 0) return;

      var agora = Date.now(), CHAVE = "cs_salto_raiz", t = 0, n = 0;
      try {
        var g = (sessionStorage.getItem(CHAVE) || "0:0").split(":");
        t = parseInt(g[0], 10) || 0; n = parseInt(g[1], 10) || 0;
      } catch (e) {}
      if (agora - t > 8000) n = 0;
      n += 1;
      try { sessionStorage.setItem(CHAVE, agora + ":" + n); } catch (e) {}
      if (n >= 3) return;

      location.replace(raiz + (location.search || "") + (location.hash || ""));
    } catch (e) {}
  })();
</script>
