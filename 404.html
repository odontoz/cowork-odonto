  <script>
  /* Link de definir senha — INLINE de proposito: o e-mail do Supabase cai aqui na home
     com o token no fragmento, e este arquivo (HTML) e servido network-first, enquanto o
     brand.js e cache-first e pode estar velho no navegador da pessoa. Sem isto, o usuario
     via a tela de login sem opcao de criar senha.
     08/09/2026: a home passou a ser servida NA RAIZ. Antes, a raiz era um redirecionamento
     que copiava location.search + location.hash para /public/index.html; agora nao ha salto
     nenhum e o fragmento chega inteiro aqui — este bloco continua sendo quem o le. A
     /public/index.html virou o redirecionamento inverso e repassa search + hash para a raiz,
     entao os dois enderecos continuam funcionando para quem tiver o link antigo. */
  (function () {
    try {
      var h = location.hash || "";
      var temToken = h.indexOf("access_token") > -1 &&
                     /type=(recovery|invite|signup|magiclink)/.test(h);
      // link expirado/ja usado volta SEM token, so com error_description —
      // sem isto a pessoa caia na home sem entender nada (caso do Thiago, 26/08)
      var temErro = h.indexOf("error") > -1 || (location.search || "").indexOf("error") > -1;
      if (!temToken && !temErro) return;
      location.replace(location.origin + "/public/app/definir-senha.html" + (h || "#erro=link"));
    } catch (e) {}
  })();
  </script>
